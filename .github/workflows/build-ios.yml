name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'app/lib/**'
      - 'app/ios/**'
      - 'app/pubspec.yaml'
      - 'app/pubspec.lock'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS (release, no codesign)
        working-directory: app
        run: |
          rm -f ios/Podfile ios/Podfile.lock
          flutter build ios --release --no-codesign

      - name: Verify app bundle
        run: |
          ls -la app/build/ios/iphoneos/
          echo "--- architectures ---"
          lipo -info app/build/ios/iphoneos/Runner.app/Runner || echo "lipo failed"
          echo "--- frameworks ---"
          ls -la app/build/ios/iphoneos/Runner.app/Frameworks/ 2>/dev/null || echo "no Frameworks dir"

      - name: Pack unsigned IPA
        run: |
          cd app/build/ios/iphoneos
          rm -rf Payload quiz-app-unsigned.ipa
          mkdir -p Payload
          ditto Runner.app Payload/Runner.app
          zip -y -r quiz-app-unsigned.ipa Payload
          ls -lh quiz-app-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-app-ios-ipa
          path: app/build/ios/iphoneos/quiz-app-unsigned.ipa
          retention-days: 30
