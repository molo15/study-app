<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="考研刷题 · 五科题库 + 背题 + 模拟卷（本地优先，多端存档）">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="考研刷题">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>考研刷题</title>
  <link rel="manifest" href="manifest.json">

  <!-- 启动加载优化：preload 并行预下载主程序与渲染引擎（默认 chromium 变体），
       与 flutter_bootstrap.js 的解析/注入并行，避免串行等待。
       实际不支持的浏览器会自动回退 full 变体，此 preload 仅作预热不阻塞。 -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/chromium/canvaskit.js" as="script">
  <link rel="preload" href="canvaskit/chromium/canvaskit.wasm" as="fetch" type="application/wasm">
</head>
<body>
  <!--
    Flutter 启动加载优化：canvaskit 本地化通过自定义 web/flutter_bootstrap.js 配置
    useLocalCanvasKit:true 实现（canvaskit 从本地 web/canvaskit/ 加载，
    免 Google gstatic CDN，国内更快更稳）。
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
